<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="artboard-width" content="806">
<title>Skylight daylight — Home</title>
<style>
/* Shared daylight shell: tokens, reset, login, generic controls and modals. */

:root {
  color-scheme: light;
  --bg: #f4efe4;
  --bg-2: #eef4f5;
  --surface: #fffdf8;
  --surface-2: #fbf6ec;
  --surface-3: #f0e9db;
  --card: #fffdf8;
  --ink: #17252f;
  --text-soft: #33424c;
  --muted: #5a6b75;
  --muted-rgb: 90, 107, 117;
  --slate: #64748b;
  --slate-rgb: 100, 116, 139;
  --line: rgba(122, 108, 88, .18);
  --line-strong: rgba(122, 108, 88, .34);
  --accent: #0b6e99;
  --accent-2: #075a7e;
  --solar: #f59e0b;
  --solar-ink: #a16207;
  --grid: #2563eb;
  --grid-ink: #1e40af;
  --grid-ink-rgb: 30, 64, 175;
  --battery: #16a34a;
  --battery-ink: #14532d;
  --home: #ea580c;
  --home-ink: #c2410c;
  --bad: #b91c1c;
  --bad-rgb: 185, 28, 28;
  --bad-soft: #fee2e2;
  --good: #166534;
  --good-rgb: 22, 101, 52;
  --good-soft: #dcfce7;
  --warn: #92400e;
  --warn-rgb: 146, 64, 14;
  --warn-soft: #fef3c7;
  --info: #0b6e99;
  --info-soft: #e0f2fe;
  /* Skylight meter fills: bright accents sampled from the calendar chips and
     the battery. Each card's top rule, shadow and readout glow use the same
     fill as its bars; the readout and icon stay page ink. */
  --bar-green: #7acc70;
  --bar-green-rgb: 122, 204, 112;
  --bar-amber: #e6be4a;
  --bar-amber-rgb: 230, 190, 74;
  --bar-blue: #447cd6;
  --bar-blue-rgb: 68, 124, 214;
  --bar-edge: rgba(23, 37, 47, .40);
  /* Darker shades of each fill for the dense 1px core of the readout/icon
     glow. These sit on cream, so they stay softer than the page ink. */
  --edge-green: #5f9661;
  --edge-amber: #a18c48;
  --edge-blue: #3561a4;
  --edge-red: #862c30;
  --edge-off: #4b565e;
  --card-edge: var(--edge-off);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 18px 60px rgba(69, 56, 36, .16);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14.5px/1.55 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button {
  font: inherit;
  cursor: pointer;
  border-radius: 9px;
  border: 1px solid var(--line-strong);
  background: rgba(255, 253, 248, .82);
  padding: 8px 14px;
  color: var(--ink);
}

button:hover { border-color: rgba(90, 76, 56, .52); background: #fffdf8; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fffdf8; font-weight: 700; }
button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
button.ghost:hover { color: var(--ink); background: rgba(122, 108, 88, .08); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }

input, select, textarea {
  font: inherit;
  padding: 8px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fffdf8;
  color: var(--ink);
}

input::placeholder { color: #8b8172; }
input:focus, select:focus, button:focus-visible, textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.hide { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; }
.ok { color: var(--good); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.banner {
  display: flex;
  gap: 12px;
  align-items: center;
  min-height: 46px;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  border: 1px solid transparent;
  color: var(--text-soft);
}
.banner.warn { background: var(--warn-soft); border-color: #f2d38b; color: #78350f; }
.banner.bad { background: var(--bad-soft); border-color: #f3b4b4; color: #7f1d1d; }
.banner.good { background: var(--good-soft); border-color: #b5e3c2; color: #14532d; }
.banner.info { background: var(--info-soft); border-color: #b9dfef; color: #075985; }

.spin {
  display: inline-block;
  width: 11px;
  height: 11px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: sp .8s linear infinite;
  vertical-align: -1px;
  margin-right: 6px;
}
@keyframes sp { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------------ login */

.login-screen {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: auto;
  background:
    radial-gradient(900px 520px at 50% 4%, rgba(255, 224, 150, .40), transparent 70%),
    radial-gradient(760px 520px at 84% 100%, rgba(181, 215, 201, .36), transparent 70%),
    linear-gradient(180deg, #eaf4f9 0%, #f4efe4 58%, #f1e8d6 100%);
}

.login-card {
  width: min(430px, 100%);
  background: linear-gradient(150deg, #fffdf8, #fbf5e9);
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  padding: 30px;
  box-shadow: var(--shadow);
}

.login-card h1 {
  font-size: 23px;
  margin: 0 0 6px;
  letter-spacing: -.025em;
}
.login-card > p { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
.login-mark {
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border-radius: 12px;
  margin-bottom: 15px;
  color: var(--solar-ink);
  background: #fef3c7;
  border: 1px solid #f2d38b;
}
.login-mark svg { width: 24px; height: 24px; }

.field { margin: 13px 0; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.field input, .field select { width: 100%; }

.note {
  font-size: 12.5px;
  color: var(--text-soft);
  background: #e8f4f9;
  border: 1px solid #c9e4ee;
  border-radius: 10px;
  padding: 11px 12px;
  margin-top: 18px;
  line-height: 1.5;
}

/* ----------------------------------------------------------------- modal */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(23, 37, 47, .38);
  backdrop-filter: blur(5px);
}

.modal {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 22px;
  border-radius: 16px;
  color: var(--ink);
  background: linear-gradient(160deg, #fffdf8, #f8f1e4 72%);
  border: 1px solid var(--line-strong);
  box-shadow: 0 30px 90px rgba(69, 56, 36, .28);
}
.modal h3 { margin: 0 0 6px; font-size: 17px; }
.modal .diff {
  font-family: var(--mono);
  font-size: 12px;
  background: #f7f2e7;
  color: #33424c;
  padding: 12px;
  border-radius: 10px;
  max-height: 220px;
  overflow: auto;
  margin: 12px 0;
  border: 1px solid var(--line);
}
.modal .diff b { color: #14532d; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; margin: 12px 0; color: var(--text-soft); }
.check input { margin-top: 3px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.result {
  white-space: pre-wrap;
  font-family: var(--mono);
  font-size: 12.5px;
  background: #f7f2e7;
  color: #33424c;
  padding: 12px;
  border-radius: 10px;
  max-height: 240px;
  overflow: auto;
  border: 1px solid var(--line);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .001ms !important;
  }
}

/* Wall-display Home stage: central battery hub, daylight composition. */

#appView {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.home-stage {
  --u: clamp(4.6px, min(0.598vw, 1.063vh), 14px);
  --type-scale: 1;
  --fs-label: clamp(12px, calc(var(--u) * 2.6), 34px);
  --fs-value: clamp(30px, calc(var(--u) * 7.3), 96px);
  --fs-unit: clamp(12px, calc(var(--u) * 3.0), 40px);
  --fs-foot: clamp(10px, calc(var(--u) * 2.2), 28px);
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  color: var(--ink);
  background:
    radial-gradient(900px 520px at 50% 5%, rgba(255, 220, 130, .40), transparent 68%),
    radial-gradient(760px 500px at 82% 72%, rgba(168, 198, 160, .18), transparent 70%),
    linear-gradient(180deg, #eaf4f9 0%, #f6f1e5 55%, #f0e7d5 100%);
}

/* --------------------------------------------------------------- scene */

.scene {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.scene-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.scene-glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(40% 38% at 50% 46%, rgba(255, 230, 170, .13), transparent 70%),
    radial-gradient(72% 42% at 50% 90%, rgba(194, 214, 181, .17), transparent 76%),
    radial-gradient(28% 22% at 50% 63%, rgba(255, 255, 255, .10), transparent 72%);
}

.house {
  position: absolute;
  left: 50%;
  top: 46%;
  z-index: 1;
  width: min(64%, calc(var(--u) * 107));
  height: auto;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 28px 34px rgba(92, 75, 48, .14));
}

/* --------------------------------------------------------------- tiles */

.tiles {
  --tile-w: min(30.3%, calc(var(--u) * 50.7));
  --card-h: calc(var(--u) * 19.6);
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.tile {
  --card-accent: var(--muted);
  --card-accent-rgb: var(--muted-rgb);
  --card-border: #ded6c7;
  --card-edge: var(--edge-off);
  --glow-ring: calc(calc(var(--u) * .30) * var(--type-scale));
  --glow-bloom: calc(calc(var(--u) * .68) * var(--type-scale));
  --glow-wide: calc(calc(var(--u) * 1.05) * var(--type-scale));
  position: absolute;
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 2.1);
  padding: calc(var(--u) * 2.0) calc(var(--u) * 2.4);
  border-radius: calc(var(--u) * 2.4);
  border: 1.5px solid var(--card-border);
  border-top: 4px solid var(--card-accent);
  background: linear-gradient(155deg, #fffdf8 0%, #fffaf0 100%);
  box-shadow:
    0 12px 28px rgba(var(--card-accent-rgb), .18),
    0 2px 4px rgba(69, 56, 36, .06),
    inset 0 1px 0 rgba(255, 255, 255, .90);
  color: var(--ink);
}

.tile--solar {
  --card-accent: var(--solar-ink);
  left: 2.7%;
  top: 7.4%;
  width: var(--tile-w);
  height: var(--card-h);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: center;
  align-items: center;
  row-gap: calc(var(--u) * 1.05);
  column-gap: calc(var(--u) * 2.1);
}

.tile--grid {
  --card-accent: var(--grid-ink);
  right: 2.6%;
  top: 12.2%;
  width: var(--tile-w);
  height: var(--card-h);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: center;
  align-items: center;
  row-gap: calc(var(--u) * 1.05);
  column-gap: calc(var(--u) * 2.1);
}

.tile--home {
  --card-accent: var(--home-ink);
  left: 2.4%;
  top: 66.4%;
  width: var(--tile-w);
  height: var(--card-h);
  min-height: calc(var(--u) * 18);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-content: center;
  align-items: center;
  row-gap: calc(var(--u) * 1.05);
  column-gap: calc(var(--u) * 2.1);
}

/* The active meter band also owns the card accent: value, unit, icon, top
   rule and shadow use the same fill as the bars. Keep these rules after the
   per-card defaults so the state always wins. */
.tile[data-level="green"] {
  --card-accent: var(--bar-green);
  --card-accent-rgb: var(--bar-green-rgb);
  --card-edge: var(--edge-green);
}
.tile[data-level="amber"] {
  --card-accent: var(--bar-amber);
  --card-accent-rgb: var(--bar-amber-rgb);
  --card-edge: var(--edge-amber);
}
.tile[data-level="red"] {
  --card-accent: var(--bad);
  --card-accent-rgb: var(--bad-rgb);
  --card-edge: var(--edge-red);
}
.tile[data-level="export"] {
  --card-accent: var(--bar-blue);
  --card-accent-rgb: var(--bar-blue-rgb);
  --card-edge: var(--edge-blue);
}
.tile[data-level="off"] {
  --card-accent: var(--muted);
  --card-accent-rgb: var(--muted-rgb);
  --card-edge: var(--edge-off);
}

.tile-icon {
  flex: none;
  width: calc(calc(var(--u) * 7.8) * var(--type-scale));
  height: calc(calc(var(--u) * 7.8) * var(--type-scale));
  color: var(--ink);
  /* Four centred shadows trace the SVG alpha: a dense core in the fill's
     darker shade, then the bar fill and two soft blooms. */
  filter:
    drop-shadow(0 0 1px var(--card-edge))
    drop-shadow(0 0 var(--glow-ring) var(--card-accent))
    drop-shadow(0 0 var(--glow-bloom) rgba(var(--card-accent-rgb), .50))
    drop-shadow(0 0 var(--glow-wide) rgba(var(--card-accent-rgb), .22));
}
.tile-icon svg { display: block; width: 100%; height: 100%; }

.solar-icon svg { display: none; }
.solar-icon[data-icon="sun"] .solar-icon__sun { display: block; }
.solar-icon[data-icon="moon"] .solar-icon__moon { display: block; }
.solar-icon[data-icon="cloud"] .solar-icon__cloud { display: block; }

.tile-body { min-width: 0; flex: 1 1 auto; }

.tile-label {
  font-size: calc(var(--fs-label) * var(--type-scale));
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -.005em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tile-value {
  display: flex;
  align-items: baseline;
  gap: calc(var(--u) * 1.1);
  margin-top: calc(var(--u) * .55);
  color: var(--ink);
  font-size: calc(var(--fs-value) * var(--type-scale));
  line-height: .95;
  font-weight: 700;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  /* The meter lights the dark readout from behind: centred core, ring and
     blooms. 0 0 offsets keep it a halo rather than a drop shadow. */
  text-shadow:
    0 0 1px var(--card-edge),
    0 0 var(--glow-ring) var(--card-accent),
    0 0 var(--glow-bloom) rgba(var(--card-accent-rgb), .50),
    0 0 var(--glow-wide) rgba(var(--card-accent-rgb), .22);
}

.tile-unit {
  font-size: calc(var(--fs-unit) * var(--type-scale));
  font-weight: 600;
  letter-spacing: 0;
  color: inherit;
}

.tile-foot {
  margin-top: calc(var(--u) * .35);
  min-height: 1.1em;
  font-size: calc(var(--fs-foot) * var(--type-scale));
  line-height: 1.2;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Five-segment power meters shared by Solar, Grid and Home Load. One/two bars
   are green, three/four amber and five red; Grid export uses blue. The bars,
   the card's top rule, its tinted shadow and the readout glow all use the
   bright Skylight accent.
   The bars themselves stay solid: the panel's contrast is modest and thin
   luminous lines disappear at distance. The 1px ink rim on a lit bar darkens
   the fill at its own edge and keeps the pale silhouettes crisp. */
.power-bars {
  --bar-color: var(--muted);
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: calc(var(--u) * .7);
  width: 100%;
}
.power-bars[data-level="green"] { --bar-color: var(--bar-green); }
.power-bars[data-level="amber"] { --bar-color: var(--bar-amber); }
.power-bars[data-level="red"] { --bar-color: var(--bad); }
.power-bars[data-level="export"] { --bar-color: var(--bar-blue); }
.power-bars[data-level="off"] { --bar-color: var(--muted); }

.power-bar {
  height: calc(var(--u) * .82);
  min-height: 5px;
  border-radius: 999px;
  border: 1px solid rgba(122, 108, 88, .18);
  background: rgba(122, 108, 88, .14);
  transition: background-color .35s ease, border-color .35s ease;
}
.power-bar.is-on {
  border-color: var(--bar-edge);
  background: var(--bar-color);
}

.home-stage[data-available="false"] .tile {
  --card-accent: var(--slate);
  --card-accent-rgb: var(--slate-rgb);
  --card-border: #ded6c7;
}
.home-stage[data-available="false"] .tile-icon {
  color: var(--slate);
  opacity: .62;
  filter: none;
}
.home-stage[data-available="false"] .tile-value {
  color: var(--slate);
  text-shadow: none;
}

.home-stage[data-stale="true"] .tile {
  opacity: .76;
}

/* --------------------------------------------------------- battery hub */

.battery-hero {
  --battery-rgb: 52, 211, 153;
  --battery-ink-rgb: 20, 83, 45;
  --battery-color: rgb(var(--battery-rgb));
  position: absolute;
  left: 50%;
  top: 25.3%;
  z-index: 4;
  width: min(14%, calc(var(--u) * 23.4));
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.battery-shell {
  position: relative;
  width: 100%;
  aspect-ratio: .53;
  border: 2.5px solid rgba(var(--battery-ink-rgb), .55);
  border-radius: calc(var(--u) * 1.8) calc(var(--u) * 1.8) calc(var(--u) * 2.8) calc(var(--u) * 2.8);
  background: linear-gradient(165deg, #fffdf8, #f6f0e4 72%);
  box-shadow:
    0 18px 36px rgba(69, 56, 36, .16),
    inset 0 1px 0 rgba(255, 255, 255, .90);
  transition: border-color .8s ease, box-shadow .8s ease;
}

.battery-cap {
  position: absolute;
  left: 31%;
  top: -3.1%;
  width: 38%;
  height: 3.3%;
  z-index: 2;
  border: 2.5px solid rgba(var(--battery-ink-rgb), .48);
  border-bottom: 0;
  border-radius: calc(var(--u) * .7) calc(var(--u) * .7) 0 0;
  background: #fffdf8;
  transition: border-color .8s ease;
}

.battery-inner {
  position: absolute;
  inset: 5.5% 6.5%;
  overflow: hidden;
  border-radius: calc(var(--u) * 1.2) calc(var(--u) * 1.2) calc(var(--u) * 2.2) calc(var(--u) * 2.2);
  background: #f3ede1;
  box-shadow: inset 0 0 0 1px rgba(122, 108, 88, .14);
  transition: box-shadow .8s ease;
}

.battery-fill {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1;
  height: calc(var(--soc, 0) * 1%);
  overflow: hidden;
  border-radius: 2px 2px 0 0;
  background-color: var(--battery-color);
  background-image: linear-gradient(180deg, rgba(255, 255, 255, .34) 0%,
                    rgba(255, 255, 255, .04) 38%, rgba(0, 0, 0, .06) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .30);
  transition: height .45s ease, background-color .8s ease, box-shadow .8s ease;
}

/* The shimmer travels in the direction the battery is moving: down while
   discharging, up while charging. It is deliberately clipped to the fill,
   so the pale headroom above the current SOC stays clean. */
.battery-fill::after {
  content: "";
  position: absolute;
  left: -20%;
  right: -20%;
  top: -65%;
  height: 45%;
  border-radius: 50%;
  background: linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, .12) 24%,
              rgba(255, 255, 255, .62) 50%, rgba(255, 255, 255, .12) 76%, transparent 100%);
  filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  will-change: transform;
}

.home-stage[data-battery="discharging"] .battery-fill::after {
  opacity: .72;
  animation: battery-shimmer-down 2.5s linear infinite;
}

.home-stage[data-battery="charging"] .battery-fill::after {
  opacity: .72;
  animation: battery-shimmer-up 2.5s linear infinite;
}

@keyframes battery-shimmer-down {
  0% { transform: translateY(-20%); }
  100% { transform: translateY(400%); }
}

@keyframes battery-shimmer-up {
  0% { transform: translateY(400%); }
  100% { transform: translateY(-20%); }
}

.battery-sheen {
  position: absolute;
  inset: 0;
  z-index: 2;
  border-radius: inherit;
  background: linear-gradient(90deg, rgba(255, 255, 255, .18), transparent 20%,
              transparent 80%, rgba(69, 56, 36, .06));
  pointer-events: none;
}

.battery-content {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8%;
}

.battery-soc {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: .02em;
  color: var(--ink);
  font-size: calc(clamp(30px, calc(var(--u) * 9.2), 116px) * var(--type-scale));
  line-height: .82;
  font-weight: 700;
  letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
}

.battery-soc-unit {
  font-size: .74em;
  letter-spacing: -.03em;
}

.battery-power {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: calc(var(--u) * .7);
  margin-top: calc(var(--u) * 1.4);
  color: var(--ink);
  font-size: calc(clamp(12px, calc(var(--u) * 3.0), 36px) * var(--type-scale));
  line-height: 1;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: color .8s ease;
}

.battery-power-unit {
  color: inherit;
  font-size: .72em;
}

.battery-caption {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--u) * .25);
  margin-top: calc(var(--u) * 1.2);
  white-space: normal;
}

.battery-caption-label {
  color: var(--ink);
  font-size: calc(clamp(12px, calc(var(--u) * 2.35), 30px) * var(--type-scale));
  font-weight: 600;
  line-height: 1.1;
}

.battery-caption-value {
  color: var(--ink);
  font-size: calc(clamp(12px, calc(var(--u) * 2.35), 32px) * var(--type-scale));
  font-weight: 600;
  line-height: 1.15;
  white-space: pre-line;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  transition: color .8s ease;
}

.live-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * .8);
  margin-top: calc(var(--u) * .95);
  color: var(--muted);
  font-size: calc(clamp(12px, calc(var(--u) * 1.9), 22px) * var(--type-scale));
  letter-spacing: .10em;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 1;
}
.live-status[data-level="live"] { display: none; }

.home-stage[data-available="false"] .battery-shell {
  border-color: #c9c1b2;
  box-shadow: 0 12px 26px rgba(69, 56, 36, .10);
}
.home-stage[data-available="false"] .battery-cap {
  border-color: #c9c1b2;
}
.home-stage[data-available="false"] .battery-soc,
.home-stage[data-available="false"] .battery-power { color: var(--slate); }
.home-stage[data-available="false"] .battery-caption-value { color: var(--slate); }
/* Use a filter rather than opacity so the battery keeps its opaque shell and
   the house cannot show through it when the feed is stale. */
.home-stage[data-stale="true"] .battery-hero {
  filter: saturate(.45) brightness(.97);
}

.home-stage[data-battery="charging"] .battery-shell {
  border-color: rgba(var(--battery-ink-rgb), .78);
}
.home-stage[data-battery="discharging"] .battery-shell {
  border-color: rgba(var(--battery-ink-rgb), .64);
}

.status-dot {
  width: calc(var(--u) * 1.05);
  height: calc(var(--u) * 1.05);
  min-width: 7px;
  min-height: 7px;
  border-radius: 50%;
  background: #64748b;
  box-shadow: 0 0 0 0 transparent;
}
.status-dot.is-live {
  background: var(--good);
  box-shadow: 0 0 0 3px rgba(21, 128, 61, .14);
}
.status-dot.is-stale { background: var(--warn); }
.status-dot.is-waiting { background: var(--muted); }
.status-dot.is-offline { background: var(--bad); }

/* --------------------------------------------------------------- flows */

.flow-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  transition: opacity .3s ease;
}

.flow-group {
  color: var(--muted);
  opacity: .24;
  transition: opacity .35s ease;
}
.flow-group.active { opacity: 1; }
.flow-group[data-flow="solar"] { color: var(--solar-ink); }
.flow-group[data-flow="grid"] { color: var(--grid-ink); }
.flow-group[data-flow="home"] { color: var(--home-ink); }

.flow-line {
  fill: none;
  stroke: currentColor;
  stroke-width: calc(var(--u) * .50);
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* A cream halo lifts the wire off the house and the hills without adding a
   glow that a low-contrast panel would smear. */
.flow-halo {
  fill: none;
  stroke: #fffdf8;
  stroke-width: calc(var(--u) * 1.65);
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .88;
}

/* A slow dotted walk in the same colour as the arrow. The offset is negative
   so the dots travel toward the marker at the end of the already-directed
   path (import/export and charge/discharge reverse the path itself). */
.flow-dots {
  fill: none;
  stroke: currentColor;
  stroke-width: calc(var(--u) * .78);
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: .1px 18px;
  stroke-dashoffset: 0;
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}

.flow-group.active .flow-dots {
  opacity: .82;
  animation: flow-dot-walk 1.4s linear infinite;
}

@keyframes flow-dot-walk {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -18.1px; }
}

.home-stage[data-stale="true"] .flow-layer { opacity: .52; }
.home-stage[data-available="false"] .flow-layer { opacity: 0; }

/* --------------------------------------------------------------- burger */

.menu-btn {
  position: absolute;
  left: 2.6%;
  top: 1.4%;
  z-index: 8;
  width: max(44px, calc(var(--u) * 4.4));
  height: max(44px, calc(var(--u) * 4.4));
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: 14px;
  border: 1.5px solid rgba(122, 108, 88, .28);
  background: rgba(255, 253, 248, .88);
  color: var(--text-soft);
  box-shadow: 0 10px 24px rgba(69, 56, 36, .12);
}
.menu-btn:hover { background: #fffdf8; border-color: rgba(90, 76, 56, .52); color: var(--ink); }
.menu-btn:focus { outline: none; }
.menu-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.menu-btn svg { width: 55%; height: 55%; }
.menu-btn::after {
  content: "";
  position: absolute;
  top: 8px;
  right: 8px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bad);
  box-shadow: 0 0 0 3px rgba(185, 28, 28, .12);
  opacity: 0;
}
.menu-btn.has-error::after { opacity: 1; }

.home-alert {
  position: absolute;
  left: 50%;
  top: 2.4%;
  z-index: 7;
  transform: translateX(-50%);
  max-width: min(62%, 760px);
  padding: 10px 14px;
  border-radius: 11px;
  border: 1px solid #f3b4b4;
  background: rgba(254, 226, 226, .97);
  color: #7f1d1d;
  font-size: clamp(11px, calc(var(--u) * 1.55), 18px);
  font-weight: 500;
  line-height: 1.35;
  box-shadow: 0 14px 40px rgba(69, 56, 36, .18);
}

/* --------------------------------------------------------------- 3:2/4:3 */

@media (max-aspect-ratio: 3/2) {
  .house {
    top: 43.5%;
    width: min(58.5%, calc(var(--u) * 98));
  }
  .battery-hero { top: 31%; }
  .tile--home { top: 64%; }
}

/* ------------------------------------------------------------- tall / square */

@media (min-width: 701px) and (max-aspect-ratio: 1/1) {
  .tile--solar,
  .tile--grid { top: 18%; }
  .battery-hero { top: 33%; }
  .tile--home { top: 70%; }
}

/* --------------------------------------------------- portrait / small */

/* Keep the same around-the-house composition when the viewport turns
   portrait; only the proportions change. No stacked fallback.
   Use the ratio form: Chromium 95 in the Skylight WebView does not match
   decimal aspect-ratio queries such as `0.95`, but does match `95/100`. */
@media (max-aspect-ratio: 95/100) {
  .home-stage {
    --type-scale: 1.5;
  }

  .house {
    top: 44%;
    width: 86%;
  }

  .battery-hero {
    top: 28%;
    width: 28%;
  }

  .tiles {
    --tile-w: 46%;
    --card-h: calc(var(--u) * 25.9);
  }

  .tile--solar {
    left: 3%;
    right: auto;
    top: 10%;
  }
  .tile--grid {
    left: auto;
    right: 3%;
    top: 10%;
  }
  .tile--home {
    left: 50%;
    right: auto;
    top: auto;
    bottom: .5%;
    transform: translateX(-50%);
  }

  .menu-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 44px;
    height: 44px;
  }
}

@media (max-aspect-ratio: 95/100) and (max-width: 599px) {
  .home-stage {
    --type-scale: 1;
  }
  .tiles {
    --card-h: calc(var(--u) * 19.6);
  }
}

@media (prefers-reduced-motion: reduce) {
  .flow-group, .flow-layer, .battery-fill, .battery-shell, .battery-cap,
  .battery-inner, .battery-power, .battery-caption-value,
  .flow-dots, .power-bar { transition: none; }
  .flow-dots { animation: none !important; }
  .battery-fill::after { animation: none !important; opacity: 0 !important; }
}

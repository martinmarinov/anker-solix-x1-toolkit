<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1200 590" role="img" aria-labelledby="houseTitle">
  <title id="houseTitle">Modern home with rooftop solar panels at night</title>
  <defs>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa78a"/>
      <stop offset="1" stop-color="#a7b99a"/>
    </linearGradient>
    <linearGradient id="wallFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe9ea"/>
      <stop offset="1" stop-color="#c8d6d9"/>
    </linearGradient>
    <linearGradient id="wallSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3d2d5"/>
      <stop offset="1" stop-color="#aebfc4"/>
    </linearGradient>
    <linearGradient id="roofLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f7f93"/>
      <stop offset="1" stop-color="#4c6b80"/>
    </linearGradient>
    <linearGradient id="roofRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#547487"/>
      <stop offset="1" stop-color="#436175"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e93ad"/>
      <stop offset="1" stop-color="#507593"/>
    </linearGradient>
    <linearGradient id="windowWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6ad"/>
      <stop offset="1" stop-color="#ffc978"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dca6"/>
      <stop offset="1" stop-color="#e5b877"/>
    </linearGradient>
  </defs>

  <!-- soft garden platform -->
  <path d="M78 548 C 210 506 410 500 596 514 C 792 529 1004 518 1112 550 C 1184 571 1144 620 978 644 C 760 674 370 676 188 646 C 58 625 32 573 78 548 Z"
        fill="url(#lawn)"/>
  <path d="M124 556 C 260 522 430 518 596 530 C 776 543 972 532 1072 558 C 1128 573 1094 604 958 624 C 760 653 390 654 224 628 C 120 612 92 578 124 556 Z"
        fill="#b0c2a6" opacity=".60"/>
  <path d="M238 578 C 292 563 390 560 468 572 L 456 600 C 366 610 290 606 240 592 Z"
        fill="#94a98c" opacity=".80"/>
  <path d="M790 580 C 860 568 960 570 1020 584 L 1006 608 C 924 616 846 611 800 600 Z"
        fill="#94a98c" opacity=".75"/>

  <!-- two simple trees -->
  <g>
    <rect x="192" y="430" width="12" height="126" rx="5" fill="#8c7461"/>
    <circle cx="198" cy="390" r="58" fill="#6f8b69"/>
    <circle cx="168" cy="424" r="38" fill="#7d9a75"/>
    <circle cx="232" cy="428" r="34" fill="#5f7b5b"/>
  </g>
  <g>
    <rect x="1054" y="438" width="11" height="118" rx="5" fill="#8c7461"/>
    <circle cx="1059" cy="402" r="50" fill="#6f8b69"/>
    <circle cx="1032" cy="432" r="32" fill="#7d9a75"/>
    <circle cx="1088" cy="434" r="30" fill="#5f7b5b"/>
  </g>

  <!-- grounded shadow -->
  <ellipse cx="660" cy="590" rx="365" ry="34" fill="#24332c" opacity=".14"/>

  <!-- left side wall -->
  <path d="M320 325 L 545 385 L 545 565 L 320 500 Z" fill="url(#wallSide)"/>
  <path d="M320 325 L 545 385 L 545 398 L 320 338 Z" fill="#dbe7e9" opacity=".30"/>

  <!-- side window, drawn to follow the receding wall -->
  <path d="M372 368 L 478 390 L 478 452 L 372 430 Z" fill="#dbe7e9"/>
  <path d="M380 376 L 470 394 L 470 444 L 380 426 Z" fill="url(#windowWarm)"/>
  <path d="M425 385 L 425 435 M 380 405 L 470 419" stroke="#a97b3f" stroke-width="2.4" opacity=".55"/>

  <!-- front gable wall -->
  <path d="M545 385 L 800 215 L 1045 350 L 1045 565 L 545 565 Z" fill="url(#wallFront)"/>
  <path d="M545 385 L 800 215 L 1045 350 L 1045 362 L 800 226 L 545 398 Z"
        fill="#eef6f7" opacity=".42"/>

  <!-- roof planes -->
  <path d="M300 300 L 545 385 L 800 215 L 550 175 Z" fill="url(#roofLeft)"/>
  <path d="M800 215 L 1045 350 L 1062 337 L 817 202 Z" fill="url(#roofRight)"/>
  <path d="M300 300 L 545 385 L 800 215 L 1045 350" fill="none" stroke="#3b5668"
        stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M550 175 L 800 215" fill="none" stroke="#3b5668" stroke-width="4" stroke-linecap="round"/>

  <!-- rooftop solar array, inset in the left roof plane -->
  <path d="M364.3 300.4 L 541 358.3 L 724.2 239.8 L 544.9 205.2 Z" fill="url(#solar)"
        stroke="#b9d5e6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M364.3 300.4 L 541 358.3 L 724.2 239.8 L 544.9 205.2 Z" fill="#cfe6f2" opacity=".10"/>
  <g stroke="#a9c9dc" stroke-width="1.4" opacity=".82">
    <path d="M408.5 314.9 L 589.7 213.9"/>
    <path d="M452.7 329.4 L 634.5 222.5"/>
    <path d="M496.9 343.9 L 679.4 231.2"/>
    <path d="M424.5 268.7 L 602.1 318.8"/>
    <path d="M484.7 236.9 L 663.2 279.3"/>
  </g>

  <!-- quiet gable detail -->
  <rect x="842" y="272" width="26" height="31" rx="4" fill="#b9cbcd" opacity=".9"/>
  <path d="M849 281 H861 M849 287 H861 M849 293 H861" stroke="#7f9496" stroke-width="1.4"
        opacity=".8"/>

  <!-- front window -->
  <rect x="575" y="405" width="80" height="70" rx="4" fill="#dbe7e9"/>
  <rect x="581" y="411" width="68" height="58" rx="2" fill="url(#windowWarm)"/>
  <path d="M615 411 L 615 469 M 581 440 L 649 440" stroke="#a97b3f" stroke-width="2.4" opacity=".55"/>

  <!-- front door -->
  <rect x="690" y="410" width="78" height="155" rx="3" fill="#dbe7e9"/>
  <rect x="696" y="416" width="66" height="149" rx="2" fill="#5d7f82"/>
  <path d="M704 430 L 704 551 M 714 430 L 714 551 M 724 430 L 724 551"
        stroke="#48696c" stroke-width="1.2" opacity=".6"/>
  <rect x="748" y="492" width="7" height="16" rx="3.5" fill="#3f5455"/>

  <!-- patio glass door -->
  <rect x="840" y="405" width="150" height="160" rx="4" fill="#dbe7e9"/>
  <rect x="846" y="411" width="138" height="148" rx="2" fill="url(#glass)"/>
  <path d="M892 411 L 892 559 M 944 411 L 944 559 M 846 480 L 984 480"
        stroke="#a97b3f" stroke-width="2.6" opacity=".7"/>

  <!-- foundation, steps and path -->
  <path d="M320 500 L 545 565 L 1045 565 L 1045 578 L 545 580 L 320 515 Z"
        fill="#98a79d"/>
  <rect x="670" y="565" width="116" height="11" rx="2" fill="#c0ccc0"/>
  <rect x="828" y="565" width="174" height="11" rx="2" fill="#c0ccc0"/>
  <path d="M690 581 L 792 581 L 822 618 L 664 618 Z" fill="#9fae9f" opacity=".80"/>
  <path d="M552 590 L 626 590 L 638 607 L 544 607 Z" fill="#8c9d8b" opacity=".55"/>
  <path d="M876 590 L 948 590 L 958 607 L 866 607 Z" fill="#8c9d8b" opacity=".50"/>

  <!-- bushes rooted at the plinth -->
  <g fill="#607a5f">
    <path d="M510 600 C 504 578 520 564 538 572 C 548 560 570 562 576 578 C 592 574 600 588 592 600 Z"/>
    <path d="M594 608 C 588 586 606 573 622 583 C 634 573 654 579 656 595 C 670 595 674 607 666 615 Z"/>
    <path d="M888 608 C 882 586 900 574 916 584 C 928 574 948 580 950 596 C 966 594 972 608 964 618 Z"/>
    <path d="M948 622 C 942 602 960 590 974 600 C 986 590 1004 596 1006 612 C 1020 612 1024 622 1016 630 Z"/>
  </g>
  <path d="M520 589 C 530 578 546 582 548 594 C 542 600 526 600 520 589 Z" fill="#7f9a7a" opacity=".75"/>
  <path d="M906 595 C 916 584 934 588 936 600 C 928 606 912 606 906 595 Z" fill="#7f9a7a" opacity=".65"/>

  <!-- soft highlights -->
  <path d="M320 500 L 545 565 L 545 580" fill="none" stroke="#dbe7e9" stroke-width="1.4" opacity=".35"/>
  <path d="M1045 352 L 1045 565" fill="none" stroke="#dbe7e9" stroke-width="1.4" opacity=".30"/>
</svg>

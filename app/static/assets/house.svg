<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1200 590" role="img" aria-labelledby="houseTitle">
  <title id="houseTitle">Modern home with rooftop solar panels at night</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17313e"/>
      <stop offset="1" stop-color="#081821"/>
    </linearGradient>
    <linearGradient id="groundInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#234854"/>
      <stop offset="1" stop-color="#0b202a"/>
    </linearGradient>
    <linearGradient id="wallFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset=".55" stop-color="#e8f0f7"/>
      <stop offset="1" stop-color="#c6d5e2"/>
    </linearGradient>
    <linearGradient id="wallSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfd0de"/>
      <stop offset="1" stop-color="#8fa5b8"/>
    </linearGradient>
    <linearGradient id="roofLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30445c"/>
      <stop offset=".55" stop-color="#1d2d41"/>
      <stop offset="1" stop-color="#142234"/>
    </linearGradient>
    <linearGradient id="roofRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23364b"/>
      <stop offset="1" stop-color="#0e1b2a"/>
    </linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset=".45" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="windowWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset=".45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2b38"/>
      <stop offset="1" stop-color="#0b141d"/>
    </linearGradient>
    <linearGradient id="bushDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6b3c"/>
      <stop offset="1" stop-color="#0d3a25"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155e43"/>
      <stop offset="1" stop-color="#082a20"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c7a45"/>
      <stop offset="1" stop-color="#124b2c"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".52"/>
      <stop offset=".55" stop-color="#f59e0b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#93c5fd" stop-opacity=".06"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ground platform -->
  <path d="M78 548 C 210 506 410 500 596 514 C 792 529 1004 518 1112 550 C 1184 571 1144 620 978 644 C 760 674 370 676 188 646 C 58 625 32 573 78 548 Z"
        fill="url(#ground)" opacity=".98"/>
  <path d="M124 556 C 260 522 430 518 596 530 C 776 543 972 532 1072 558 C 1128 573 1094 604 958 624 C 760 653 390 654 224 628 C 120 612 92 578 124 556 Z"
        fill="url(#groundInner)" opacity=".55"/>
  <path d="M78 548 C 210 506 410 500 596 514 C 792 529 1004 518 1112 550"
        fill="none" stroke="#3f6570" stroke-width="2" opacity=".30"/>

  <!-- lawn patches -->
  <path d="M238 578 C 292 563 390 560 468 572 L 456 600 C 366 610 290 606 240 592 Z"
        fill="url(#lawn)" opacity=".90"/>
  <path d="M790 580 C 860 568 960 570 1020 584 L 1006 608 C 924 616 846 611 800 600 Z"
        fill="url(#lawn)" opacity=".85"/>
  <path d="M318 566 L 430 562 L 424 576 L 316 582 Z" fill="#4ade80" opacity=".14"/>
  <path d="M850 576 L 972 578 L 964 590 L 850 588 Z" fill="#4ade80" opacity=".12"/>

  <!-- trees behind the house -->
  <g opacity=".96">
    <rect x="193" y="427" width="12" height="129" rx="4" fill="#3d2a20"/>
    <path d="M199 300 C 178 330 164 350 148 376 C 165 376 174 383 186 394 C 170 410 157 428 142 448 C 166 442 179 443 199 455 C 219 443 232 442 256 448 C 241 428 228 410 212 394 C 224 383 233 376 250 376 C 234 350 220 330 199 300 Z"
          fill="url(#tree)"/>
    <path d="M199 326 C 189 344 180 361 168 380 C 181 377 189 381 199 390 C 209 381 217 377 230 380 C 218 361 209 344 199 326 Z"
          fill="#2c8a58" opacity=".22"/>
  </g>
  <g opacity=".92">
    <rect x="1054" y="435" width="11" height="118" rx="4" fill="#3d2a20"/>
    <path d="M1059 318 C 1039 346 1024 367 1008 392 C 1026 389 1036 394 1048 405 C 1032 421 1020 438 1005 458 C 1028 451 1041 452 1059 464 C 1077 452 1090 451 1113 458 C 1098 438 1086 421 1070 405 C 1082 394 1092 389 1110 392 C 1094 367 1079 346 1059 318 Z"
          fill="url(#tree)"/>
    <path d="M1059 342 C 1049 360 1041 376 1030 394 C 1042 391 1050 396 1059 404 C 1068 396 1076 391 1088 394 C 1077 376 1069 360 1059 342 Z"
          fill="#2c8a58" opacity=".18"/>
  </g>

  <!-- soft rim light behind the house -->
  <ellipse cx="645" cy="385" rx="380" ry="230" fill="url(#rim)" opacity=".55"/>

  <!-- house shadow -->
  <ellipse cx="660" cy="590" rx="370" ry="40" fill="#020a10" opacity=".48"/>

  <!-- left side wall -->
  <path d="M320 325 L 545 385 L 545 565 L 320 500 Z" fill="url(#wallSide)"/>
  <path d="M320 325 L 545 385 L 545 398 L 320 338 Z" fill="#eef5fb" opacity=".12"/>
  <path d="M320 345 L 545 405 L 545 420 L 320 360 Z" fill="#0b1a2a" opacity=".13"/>

  <!-- side wall window (follows the receding wall) -->
  <path d="M372 368 L 478 390 L 478 452 L 372 430 Z" fill="#e3edf5" opacity=".55"/>
  <path d="M380 376 L 470 394 L 470 444 L 380 426 Z" fill="url(#windowWarm)"/>
  <path d="M425 385 L 425 435 M 380 405 L 470 419" stroke="#b07b26" stroke-width="2.6" opacity=".55"/>
  <path d="M372 368 L 478 390 L 478 452 L 372 430 Z" fill="none" stroke="#c7d5e1" stroke-width="3"/>

  <!-- front gable wall -->
  <path d="M545 385 L 800 215 L 1045 350 L 1045 565 L 545 565 Z" fill="url(#wallFront)"/>
  <path d="M545 385 L 545 565" stroke="#93a8bb" stroke-width="1.4" opacity=".28"/>
  <path d="M545 385 L 800 215 L 1045 350 L 1045 362 L 800 226 L 545 398 Z"
        fill="#ffffff" opacity=".42"/>

  <!-- left roof plane -->
  <path d="M300 300 L 545 385 L 800 215 L 550 175 Z" fill="url(#roofLeft)"/>
  <path d="M300 300 L 545 385 L 800 215 L 550 175 Z" fill="none"
        stroke="#0a1520" stroke-width="3" stroke-linejoin="round" opacity=".75"/>

  <!-- narrow far roof edge; deliberately not a second large plane -->
  <path d="M800 215 L 1045 350 L 1062 337 L 817 202 Z" fill="url(#roofRight)" opacity=".95"/>
  <path d="M800 215 L 1045 350 L 1062 337 L 817 202 Z" fill="none"
        stroke="#0a1520" stroke-width="2" stroke-linejoin="round" opacity=".65"/>

  <!-- roof edge, gutter and ridge -->
  <path d="M300 300 L 545 385" fill="none" stroke="#0c1823" stroke-width="9" stroke-linecap="round"/>
  <path d="M545 385 L 800 215 L 1045 350" fill="none" stroke="#0c1823" stroke-width="8"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M300 300 L 545 385 L 800 215 L 1045 350" fill="none" stroke="#7a94aa"
        stroke-width="1.6" stroke-linejoin="round" opacity=".34"/>
  <path d="M550 175 L 800 215" fill="none" stroke="#0c1823" stroke-width="5" stroke-linecap="round"/>
  <path d="M550 175 L 800 215" fill="none" stroke="#7a94aa" stroke-width="1.2" opacity=".35"/>

  <!-- solar array, bilinearly inset in the left roof plane so its grid follows the roof perspective -->
  <path d="M364.3 300.4 L 541 358.3 L 724.2 239.8 L 544.9 205.2 Z" fill="url(#solar)"
        stroke="#bfdbfe" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M364.3 300.4 L 541 358.3 L 724.2 239.8 L 544.9 205.2 Z" fill="url(#panelSheen)" opacity=".55"/>
  <g stroke="#93c5fd" stroke-width="1.15" opacity=".78">
    <path d="M408.5 314.9 L 589.7 213.9"/>
    <path d="M452.7 329.4 L 634.5 222.5"/>
    <path d="M496.9 343.9 L 679.4 231.2"/>
    <path d="M424.5 268.7 L 602.1 318.8"/>
    <path d="M484.7 236.9 L 663.2 279.3"/>
  </g>
  <g stroke="#dbeafe" stroke-width="1" opacity=".38">
    <path d="M357.6 296.8 L 534.3 354.7"/>
    <path d="M552.2 209.8 L 731.5 244.4"/>
    <path d="M495.4 343.2 L 715.7 234.6"/>
  </g>
  <path d="M364.3 300.4 L 541 358.3 L 724.2 239.8 L 544.9 205.2 Z" fill="none"
        stroke="#e0efff" stroke-width="1.4" stroke-linejoin="round" opacity=".65"/>

  <!-- gable vent -->
  <rect x="842" y="272" width="26" height="31" rx="4" fill="#dbe7f1" opacity=".62"/>
  <rect x="847" y="277" width="16" height="21" rx="2" fill="#a9bbc9" opacity=".40"/>
  <path d="M849 281 H861 M849 287 H861 M849 293 H861" stroke="#7f94a6" stroke-width=".9" opacity=".55"/>

  <!-- warm window glow -->
  <ellipse cx="615" cy="440" rx="100" ry="82" fill="url(#warmGlow)"/>
  <ellipse cx="915" cy="480" rx="140" ry="112" fill="url(#warmGlow)"/>
  <ellipse cx="425" cy="415" rx="82" ry="68" fill="url(#warmGlow)" opacity=".72"/>

  <!-- front-left window -->
  <rect x="575" y="405" width="80" height="70" rx="4" fill="#e3edf5" opacity=".55"/>
  <rect x="581" y="411" width="68" height="58" rx="2" fill="url(#windowWarm)"/>
  <path d="M615 411 L 615 469 M 581 440 L 649 440" stroke="#b07b26" stroke-width="2.6" opacity=".55"/>
  <rect x="575" y="405" width="80" height="70" rx="4" fill="none" stroke="#c7d5e1" stroke-width="3"/>

  <!-- front door -->
  <rect x="690" y="410" width="78" height="155" rx="3" fill="#e4edf5" opacity=".50"/>
  <rect x="696" y="416" width="66" height="149" rx="2" fill="url(#door)"/>
  <path d="M704 428 L 704 550 M 713 428 L 713 550 M 722 428 L 722 550"
        stroke="#33475a" stroke-width="1.2" opacity=".32"/>
  <rect x="748" y="492" width="7" height="16" rx="3.5" fill="#cbd5e1"/>
  <rect x="690" y="410" width="78" height="155" rx="3" fill="none" stroke="#c7d5e1" stroke-width="3"/>

  <!-- front patio window / glass door -->
  <rect x="840" y="405" width="150" height="160" rx="4" fill="#e3edf5" opacity=".55"/>
  <rect x="846" y="411" width="138" height="148" rx="2" fill="url(#windowWarm)"/>
  <path d="M892 411 L 892 559 M 944 411 L 944 559 M 846 480 L 984 480"
        stroke="#b07b26" stroke-width="3" opacity=".55"/>
  <rect x="840" y="405" width="150" height="160" rx="4" fill="none" stroke="#c7d5e1" stroke-width="3"/>

  <!-- tiny wall light -->
  <rect x="780" y="475" width="14" height="22" rx="2" fill="#fde68a" opacity=".85"/>
  <ellipse cx="787" cy="486" rx="26" ry="26" fill="url(#warmGlow)" opacity=".7"/>

  <!-- foundation / plinth -->
  <path d="M320 500 L 545 565 L 1045 565 L 1045 578 L 545 580 L 320 515 Z"
        fill="#7a8d9d" opacity=".55"/>
  <path d="M320 515 L 545 580 L 1045 578" fill="none" stroke="#b9c8d5" stroke-width="1.4" opacity=".3"/>

  <!-- steps and walkway -->
  <rect x="670" y="565" width="116" height="11" rx="2" fill="#c8d6e2"/>
  <rect x="670" y="576" width="116" height="5" rx="2" fill="#7f93a5" opacity=".55"/>
  <rect x="828" y="565" width="174" height="11" rx="2" fill="#c8d6e2"/>
  <rect x="828" y="576" width="174" height="5" rx="2" fill="#7f93a5" opacity=".55"/>
  <path d="M690 581 L 792 581 L 822 618 L 664 618 Z" fill="#b8c7d3" opacity=".55"/>
  <path d="M700 586 L 785 586 L 806 611 L 680 611 Z" fill="#dbe6ee" opacity=".22"/>
  <path d="M552 590 L 626 590 L 638 607 L 544 607 Z" fill="#9fb2c1" opacity=".35"/>
  <path d="M876 590 L 948 590 L 958 607 L 866 607 Z" fill="#9fb2c1" opacity=".32"/>

  <!-- grounded shadows for the bushes -->
  <ellipse cx="560" cy="612" rx="78" ry="12" fill="#020a10" opacity=".22"/>
  <ellipse cx="650" cy="620" rx="52" ry="10" fill="#020a10" opacity=".20"/>
  <ellipse cx="948" cy="618" rx="78" ry="12" fill="#020a10" opacity=".22"/>

  <!-- bushes rooted at the plinth -->
  <g>
    <path d="M510 600 C 504 578 520 564 538 572 C 548 560 570 562 576 578 C 592 574 600 588 592 600 Z"
          fill="url(#bushDark)"/>
    <path d="M594 608 C 588 586 606 573 622 583 C 634 573 654 579 656 595 C 670 595 674 607 666 615 Z"
          fill="url(#bushDark)"/>
    <path d="M676 618 C 670 600 686 588 700 596 C 712 588 728 594 730 608 C 742 608 746 618 738 626 Z"
          fill="url(#bushDark)"/>
    <path d="M888 608 C 882 586 900 574 916 584 C 928 574 948 580 950 596 C 966 594 972 608 964 618 Z"
          fill="url(#bushDark)"/>
    <path d="M948 622 C 942 602 960 590 974 600 C 986 590 1004 596 1006 612 C 1020 612 1024 622 1016 630 Z"
          fill="url(#bushDark)"/>
    <path d="M520 589 C 530 578 546 582 548 594 C 542 600 526 600 520 589 Z"
          fill="#35a363" opacity=".26"/>
    <path d="M906 595 C 916 584 934 588 936 600 C 928 606 912 606 906 595 Z"
          fill="#35a363" opacity=".22"/>
  </g>

  <!-- foreground rim highlights -->
  <path d="M320 500 L 545 565 L 545 580" fill="none" stroke="#e2e8f0" stroke-width="1.2" opacity=".20"/>
  <path d="M1045 352 L 1045 565" fill="none" stroke="#e2e8f0" stroke-width="1.2" opacity=".18"/>
</svg>
